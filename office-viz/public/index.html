<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office Viz</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0c10;
    color: #d7dae0;
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    height: 44px;
    padding: 0 12px;
    background: #14151b;
    border-bottom: 1px solid #262832;
  }
  header h1 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.03em;
    margin: 0;
    color: #e8eaf0;
  }
  #status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #9aa0ac;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #4a4e5a;
    box-shadow: 0 0 4px rgba(0, 0, 0, 0.4);
  }
  .dot.connected { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
  .dot.disconnected { background: #e05252; box-shadow: 0 0 6px #e05252; }
  header a {
    margin-left: auto;
    color: #8fb3ff;
    text-decoration: none;
    font-size: 13px;
  }
  header a:hover { text-decoration: underline; }
  #stage {
    position: relative;
    width: 100%;
    height: calc(100% - 44px);
    background: #0b0c10;
    overflow: hidden;
  }
  #scene {
    position: absolute;
    top: 0;
    left: 0;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }
  #hud {
    position: absolute;
    top: 8px;
    right: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    pointer-events: none;
    z-index: 2;
  }
  .run-panel {
    background: rgba(20, 21, 27, 0.9);
    border: 1px solid #2c2e38;
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 11px;
    line-height: 1.5;
    min-width: 180px;
    pointer-events: auto;
    cursor: pointer;
  }
  .run-panel .repo {
    font-weight: 600;
    color: #e8eaf0;
    margin-bottom: 2px;
  }
  .run-panel .row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    color: #9aa0ac;
  }
  .sev { font-weight: 600; }
  .sev.blocker { color: #e05252; }
  .sev.major { color: #e0a552; }
  .sev.minor { color: #7fb3e0; }
  #console {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 40%;
    min-width: 260px;
    background: #0d0e12;
    border-left: 1px solid #2c2e38;
    display: flex;
    flex-direction: column;
    font-family: Consolas, 'Courier New', monospace;
    z-index: 3;
    box-shadow: -6px 0 18px rgba(0, 0, 0, 0.4);
  }
  #console.hidden { display: none; }
  .console-header {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 32px;
    padding: 0 8px;
    border-bottom: 1px solid #2c2e38;
    font-size: 12px;
  }
  #consoleTitle {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #e8eaf0;
    font-weight: 600;
  }
  .console-status {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: #9aa0ac;
    white-space: nowrap;
  }
  #consoleClose {
    background: none;
    border: none;
    color: #9aa0ac;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 4px;
  }
  #consoleClose:hover { color: #e8eaf0; }
  #consoleBody {
    flex: 1;
    overflow-y: auto;
    padding: 6px 8px;
    font-size: 11px;
    line-height: 1.5;
    background-image: repeating-linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.015) 0px,
      rgba(255, 255, 255, 0.015) 1px,
      transparent 1px,
      transparent 3px
    );
  }
  .log-line {
    white-space: pre-wrap;
    word-break: break-word;
    margin-bottom: 1px;
  }
  .log-time {
    color: #565b68;
    margin-right: 6px;
  }
  .log-sidechain {
    color: #e0a552;
    margin-right: 4px;
  }
  .kind-thinking .log-content { color: #7a7f8c; font-style: italic; }
  .kind-text .log-content { color: #d7dae0; }
  .kind-tool_use .log-content { color: #7fd4e8; }
  .kind-tool_result .log-content { color: #6b7280; }
  .kind-user .log-content { color: #f6ad55; }
  .log-notice { color: #9aa0ac; font-style: italic; padding: 4px 0; }
  .console-jump {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: #2c2e38;
    color: #e8eaf0;
    border: 1px solid #3a3d4a;
    border-radius: 12px;
    padding: 4px 10px;
    font-size: 11px;
    cursor: pointer;
  }
  .console-jump.hidden { display: none; }
</style>
</head>
<body>
  <header>
    <h1>Office Viz</h1>
    <div id="status">
      <span id="statusDot" class="dot disconnected"></span>
      <span id="statusText">connecting&hellip;</span>
    </div>
    <a href="dashboard.html">Dashboard</a>
  </header>
  <main id="stage">
    <canvas id="scene"></canvas>
    <div id="hud"></div>
    <div id="console" class="hidden">
      <div class="console-header">
        <span id="consoleTitle"></span>
        <span class="console-status">
          <span id="consoleDot" class="dot disconnected"></span>
          <span id="consoleStatusText">disconnected</span>
        </span>
        <button id="consoleClose" aria-label="Close console">&times;</button>
      </div>
      <div id="consoleBody"></div>
      <button id="consoleJump" class="console-jump hidden">Jump to latest &darr;</button>
    </div>
  </main>
  <script src="office.js"></script>
</body>
</html>
